spring.application.name=ai-generated-tweet-to-kafka-service
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

# ---- ai-generated-tweet-to-kafka-service ----
ai-generated-tweet-to-kafka-service.streaming-data-keywords[0]=Java
ai-generated-tweet-to-kafka-service.streaming-data-keywords[1]=Microservices
ai-generated-tweet-to-kafka-service.streaming-data-keywords[2]=Spring
ai-generated-tweet-to-kafka-service.streaming-data-keywords[3]=Kafka
ai-generated-tweet-to-kafka-service.streaming-data-keywords[4]=Elasticsearch
ai-generated-tweet-to-kafka-service.scheduler-duration-sec=30
ai-generated-tweet-to-kafka-service.prompt=Generate a json with 4 elements called createdAt, id, text and user. The user element has also a nested json element called id. For createdAt use a date in format 'EEE MMM dd HH:mm:ss zzz yyyy', example date would be 'Fri Oct 06 14:32:25 UTC 2023', for id use a java long value, for text use a string including one or more of the keywords: {keywords}. For id field of the user field use a java long value. Do not write anything on the response other than the json text. That means omit ```json part in the response and any other explanation. Do not use new lines in the response. Do not include the L letter at the end of the long values. Only give 1 result in the response.
ai-generated-tweet-to-kafka-service.keywords-placeholder={keywords}






